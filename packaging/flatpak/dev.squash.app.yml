# Flatpak manifest for Squash (GUI) — STARTER, not yet submitted to Flathub.
#
# The app ID matches the Tauri bundle identifier (app/src-tauri/tauri.conf.json).
# Flathub requires proof you control the ID's domain: `dev.squash.app` needs
# squash.dev verification; otherwise rename the ID to `io.github.qtrcipher.Squash`
# (allowed via GitHub) — which also means changing the Tauri identifier.
#
# Before the first Flathub submission (post-release manual step):
#   1. Generate offline sources and add them as modules sources:
#        flatpak-node-generator --no-requests-cache -o node-sources.json npm app/package-lock.json
#        python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py -o cargo-sources.json Cargo.lock
#      (https://github.com/flatpak/flatpak-builder-tools)
#   2. Add appstream metainfo (dev.squash.app.metainfo.xml) — see
#      https://v2.tauri.app/distribute/flatpak/
#   3. Test locally: flatpak-builder --user --install build dev.squash.app.yml
#   4. Submit: fork flathub/flathub, branch dev.squash.app, PR against `new-pr`.
#
# Runtime notes: org.gnome.Platform ships WebKitGTK that Tauri v2 needs
# (docs/05 §5 note on Linux webview variance). Check for the latest
# runtime-version before submitting.
id: dev.squash.app
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: squash
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Compressors need to read/write the user's files.
  - --filesystem=home
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
modules:
  - name: squash
    buildsystem: simple
    env:
      HOME: /run/build/squash
      CARGO_HOME: /run/build/squash/cargo
      npm_config_offline: 'true'
      npm_config_cache: /run/build/squash/flatpak-node/npm-cache
    sources:
      - type: git
        url: https://github.com/qtrcipher/squash.git
        tag: v0.1.0 # TEMPLATE — update per release
      # Generated pre-submission (see header):
      # - node-sources.json
      # - cargo-sources.json
    build-commands:
      # Vendored cargo sources (offline build).
      - mkdir -p .cargo && printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "/run/build/squash/cargo/vendor"\n' > .cargo/config.toml
      - cd app && npm ci --offline && npm run tauri build -- --no-bundle
      - install -Dm755 app/src-tauri/target/release/squash-app /app/bin/squash
      - install -Dm644 app/src-tauri/linux/main.desktop /app/share/applications/dev.squash.app.desktop
      - install -Dm644 app/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.squash.app.png
      - install -Dm644 app/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/dev.squash.app.png
      - install -Dm644 app/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.squash.app.png
      # Add pre-submission:
      # - install -Dm644 dev.squash.app.metainfo.xml /app/share/metainfo/dev.squash.app.metainfo.xml
