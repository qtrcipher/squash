[package]
name = "squash-core"
description = "Squash shared compression core: jobs, formats, presets, progress, errors, store types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `rar` (default ON): RAR *extraction* via the vendored RARLAB UnRAR source
# (crates/unrar-sys). The UnRAR license is not OSI-approved and forbids RAR
# creation, so downstream libre-only builds use `--no-default-features`
# (docs/05 §4/§7). RAR creation is never enabled by anything.
default = ["rar"]
rar = ["dep:unrar-sys"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Store persistence (docs/06 §3/§5): directory resolution, comment-preserving
# TOML, locked appends, RFC 3339 timestamps, v4 ids for history/queue entries.
directories = "6"
toml = "0.8"
toml_edit = "0.25"
fs2 = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
zip.workspace = true
sevenz-rust2.workspace = true
tar.workspace = true
flate2.workspace = true
zstd.workspace = true
bzip2.workspace = true
xz2.workspace = true
walkdir.workspace = true
unrar-sys = { path = "../unrar-sys", optional = true }

[dev-dependencies]
tempfile.workspace = true
