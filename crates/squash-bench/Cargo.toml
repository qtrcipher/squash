[package]
name = "squash-bench"
description = "Squash benchmark harness vs 7-Zip (docs/05 §6)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "squash_bench"
path = "src/lib.rs"

[[bin]]
name = "squash-bench"
path = "src/main.rs"

[dependencies]
squash-core = { path = "../squash-core" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
